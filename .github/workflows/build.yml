name: build-deb

# 云端编译 DumpKeiem 插件。
# 产物走两条通道：Actions Artifacts（主）+ GitHub Release（备用，更可靠）。

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        uses: Randomblock1/theos-action@main

      - name: Build (rootless + rootful)
        run: |
          set -x
          mkdir -p out
          for scheme in rootless rootful; do
            make clean >/dev/null 2>&1 || true
            if [ "$scheme" = "rootful" ]; then
              make package FINALPACKAGE=1 || true
            else
              make package THEOS_PACKAGE_SCHEME="$scheme" FINALPACKAGE=1 || true
            fi
            for f in packages/*.deb; do
              [ -e "$f" ] || continue
              base=$(basename "$f" .deb)
              cp "$f" "out/${base}__${scheme}.deb"
            done
          done
          echo "=== built ==="
          ls -la out || true
          echo "=== sha256 ==="
          shasum -a 256 out/*.deb || true
          echo "=== dylib inside ==="
          for f in out/*rootless*.deb; do
            [ -e "$f" ] || continue
            mkdir -p /tmp/x && cd /tmp/x && rm -rf * 
            ar x "/Users/runner/work/dumpkeiem/dumpkeiem/$f" 2>/dev/null || ar x "$f" || true
            ls
          done
          true

      - name: Upload debs (artifact)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: debs
          path: out/*.deb
          if-no-files-found: warn
          retention-days: 30

      - name: Publish release (fallback channel)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out || true
          if ls out/*.deb >/dev/null 2>&1; then
            gh release delete latest --yes --cleanup-tag 2>/dev/null || true
            gh release create latest $(ls out/*.deb) \
              --title "latest build" \
              --notes "auto build $(date -u +%FT%TZ)" || true
            echo "release published"
          else
            echo "no deb to publish"
          fi
